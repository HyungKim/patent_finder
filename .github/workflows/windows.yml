# GitHub의 Windows 러너에서 설치와 시험을 확인한다. 합성 시험 자료만 쓴다.
# Python 3.11, 3.12, 3.13 각각에서 돈다.
#
# - tests (push·수동): 새 가상환경을 만들어 그 안의 pip(그 Python에 들어 있는 버전 그대로)으로
#   requirements.lock을 설치하고, 모델을 받아 점검·합성 자료 분석·시험 전체를 실행한다.
# - batch-files (push·수동): 저장소 파일에 설치 패키지와 모델을 채워 설치 묶음과 같은 폴더를 만들고,
#   setup.bat · mark.bat · run.bat · train.bat을 사용자가 하듯이 실행한다(tests/windows_bundle_check.py).
#   폴더를 옮긴 뒤에도 다시 확인한다. 릴리스를 만들기 전에 batch 파일을 확인하는 용도다.
# - release-bundle (수동, 태그를 넣었을 때만): 릴리스에 첨부한 설치 묶음을 받아 풀고 같은 확인을 한 뒤,
#   묶음 안의 시험 전체를 실행한다. base_tag까지 넣으면 그 이전 묶음을 설치한 위에 새 code-only zip을
#   덮어쓰는 "코드만 바꾸기"도 확인한다.
#
# 러너는 영문 Windows Server다. 한국어 Windows 10/11과는 시스템 로캘이 다르다.
name: Windows 시험

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 설치 묶음을 확인할 릴리스 태그 (비우면 묶음 확인은 건너뜀)
        default: ""
      base_tag:
        description: 코드만 바꾸기(code-only zip)를 확인할 이전 릴리스 태그 (비우면 건너뜀)
        default: ""
        required: false

permissions:
  contents: read

jobs:
  tests:
    name: 설치와 시험 (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: 환경 확인
        run: |
          python -VV
          [System.Environment]::OSVersion.VersionString
          "culture=$((Get-Culture).Name) ansi_codepage=$((Get-Culture).TextInfo.ANSICodePage)"
          python -c "import locale, sys; print('python locale encoding:', locale.getpreferredencoding(False), '| stdout:', sys.stdout.encoding)"
      - name: 가상환경 만들기
        run: python -m venv .venv
      - name: pip 버전 (새 가상환경에 들어 있는 그대로)
        run: .venv\Scripts\python -m pip --version
      - name: 운영 패키지 설치 (requirements.lock, 해시 검증)
        run: .venv\Scripts\python -m pip install --disable-pip-version-check --require-hashes --no-deps --no-cache-dir -r requirements.lock
      - name: 모델 캐시
        id: model-cache
        uses: actions/cache@v6
        with:
          path: models/multilingual-e5-small
          key: e5-small-onnx-${{ hashFiles('tools/fetch_model.py') }}
      - name: 모델 받기 (준비 환경용 도구)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: .venv\Scripts\python tools\fetch_model.py --dest models\multilingual-e5-small
      - name: 점검 (doctor --offline)
        env:
          PYTHONPATH: src
        run: .venv\Scripts\python -m patent_marker.cli doctor --offline
      - name: 사업부별 합성 보고자료 분석
        env:
          PYTHONPATH: src
        run: .venv\Scripts\python -m patent_marker.cli analyze --input tests\fixtures\divisions --output outputs\divisions-001
      - name: 정답표 대조
        run: .venv\Scripts\python tools\check_expected.py --results outputs\divisions-001\results.jsonl
      - name: 시험용 패키지 설치
        run: .venv\Scripts\python -m pip install --disable-pip-version-check --no-cache-dir -r requirements\dev.in
      - name: 시험 전체 (실제 모델 포함)
        run: .venv\Scripts\python -m pytest -ra

  batch-files:
    name: batch 파일 (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # 3.11에서는 지정하지 않아 setup.bat이 스스로 찾게 하고, 나머지는 그 버전을 쓰게 한다.
      PM_PYTHON: ${{ matrix.python-version != '3.11' && format('py -{0}', matrix.python-version) || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: 환경 확인
        run: |
          python -VV
          "PM_PYTHON=[$env:PM_PYTHON]"
          py -0p
      - name: 모델 캐시
        id: model-cache
        uses: actions/cache@v6
        with:
          path: models/multilingual-e5-small
          key: e5-small-onnx-${{ hashFiles('tools/fetch_model.py') }}
      - name: 모델 받기 (준비 환경용 도구)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python tools\fetch_model.py --dest models\multilingual-e5-small
      - name: 설치 패키지 받기 (묶음에 넣는 것과 같은 파일, 해시 검증)
        run: python tools\prepare_offline_bundle.py --python-version ${{ matrix.python-version }}
      - name: 설치 묶음과 같은 폴더 만들기
        run: |
          $root = if (Test-Path 'D:\') { 'D:\pf-check' } else { Join-Path $env:RUNNER_TEMP 'pf-check' }
          $pf = Join-Path $root 'patent_finder'
          New-Item -ItemType Directory -Path $pf -Force | Out-Null
          robocopy . $pf /E /XD .git .venv data artifacts outputs /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy 실패: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          Get-ChildItem -Force $pf | Select-Object -ExpandProperty Name
          "PF_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PF_DIR=$pf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: setup.bat · mark.bat · run.bat 확인
        working-directory: ${{ env.PF_DIR }}
        run: python tests\windows_bundle_check.py --expect ${{ matrix.python-version }}
      - name: 설치한 폴더를 다른 곳으로 옮기기
        run: |
          $moved = Join-Path $env:PF_ROOT 'moved here\patent_finder'
          New-Item -ItemType Directory -Path (Split-Path $moved) | Out-Null
          Move-Item -LiteralPath $env:PF_DIR -Destination $moved
          if (Test-Path -LiteralPath $env:PF_DIR) { throw '옮긴 뒤에도 원래 폴더가 남아 있다' }
          "옮긴 폴더: $moved"
          "PF_DIR=$moved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 옮긴 뒤 다시 확인 (경로에 공백 포함)
        working-directory: ${{ env.PF_DIR }}
        run: python tests\windows_bundle_check.py --expect ${{ matrix.python-version }} --moved

  release-bundle:
    name: 설치 묶음 (setup.bat · Python ${{ matrix.python-version }})
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      TAG: ${{ inputs.tag }}
      # 3.11에서는 지정하지 않아 setup.bat이 스스로 찾게 하고, 나머지는 그 버전을 쓰게 한다.
      PM_PYTHON: ${{ matrix.python-version != '3.11' && format('py -{0}', matrix.python-version) || '' }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: 환경 확인
        run: |
          python -VV
          [System.Environment]::OSVersion.VersionString
          "culture=$((Get-Culture).Name) ansi_codepage=$((Get-Culture).TextInfo.ANSICodePage)"
          "PM_PYTHON=[$env:PM_PYTHON]"
          py -0p
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free / 1GB, 1)}}
      - name: 묶음 내려받기와 해시 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'bundle'
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'patent_finder-*-windows-x64*.zip' --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem (Join-Path $dir '*.zip') | Select-Object -First 1
          $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          $expected = ($release.assets | Where-Object { $_.name -eq $zip.Name }).digest
          $actual = 'sha256:' + (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "file=$($zip.Name) size=$($zip.Length)"
          "expected=$expected"
          "actual=$actual"
          if ($expected -ne $actual) { throw '내려받은 파일의 해시가 릴리스에 기록된 값과 다르다' }
      - name: 압축 풀기 (D 드라이브가 있으면 D:\patent_finder)
        run: |
          $zip = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'bundle\*.zip') | Select-Object -First 1
          $root = if (Test-Path 'D:\') { 'D:\' } else { Join-Path $env:RUNNER_TEMP 'install' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $root
          $pf = Join-Path $root 'patent_finder'
          "설치 폴더: $pf"
          Get-ChildItem -Force $pf | Select-Object -ExpandProperty Name
          if (-not (Test-Path -LiteralPath (Join-Path $pf 'tests\fixtures\divisions\광학솔루션사업부_기술보고_합성.pptx'))) { throw '한글 파일명이 깨졌다' }
          "PF_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PF_DIR=$pf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: setup.bat · mark.bat · run.bat 확인
        working-directory: ${{ env.PF_DIR }}
        run: python tests\windows_bundle_check.py --expect ${{ matrix.python-version }}
      - name: 설치한 폴더를 다른 곳으로 옮기기
        run: |
          $moved = Join-Path $env:PF_ROOT 'moved here\patent_finder'
          New-Item -ItemType Directory -Path (Split-Path $moved) | Out-Null
          Move-Item -LiteralPath $env:PF_DIR -Destination $moved
          if (Test-Path -LiteralPath $env:PF_DIR) { throw '옮긴 뒤에도 원래 폴더가 남아 있다' }
          "옮긴 폴더: $moved"
          "PF_DIR=$moved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 옮긴 뒤 다시 확인 (경로에 공백 포함)
        working-directory: ${{ env.PF_DIR }}
        run: python tests\windows_bundle_check.py --expect ${{ matrix.python-version }} --moved
      - name: 새 버전으로 바꾸기 (예전 폴더는 이름을 바꾸고, 새로 풀어 기록만 옮김)
        run: |
          $parent = Split-Path $env:PF_DIR
          $old = Join-Path $parent 'patent_finder_old'
          Rename-Item -LiteralPath $env:PF_DIR -NewName 'patent_finder_old'
          $zip = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'bundle\*.zip') | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $parent
          foreach ($name in 'data', 'artifacts', 'outputs') {
            Move-Item -LiteralPath (Join-Path $old $name) -Destination (Join-Path $env:PF_DIR $name)
          }
          Get-ChildItem -Force $env:PF_DIR | Select-Object -ExpandProperty Name
      - name: 바꾼 뒤 다시 확인 (setup.bat부터, 예전 기록 유지)
        working-directory: ${{ env.PF_DIR }}
        run: python tests\windows_bundle_check.py --expect ${{ matrix.python-version }} --upgraded
      - name: 예전 폴더 지우기
        run: |
          $old = Join-Path (Split-Path $env:PF_DIR) 'patent_finder_old'
          Remove-Item -LiteralPath $old -Recurse -Force
          if (Test-Path -LiteralPath $old) { throw '예전 폴더가 지워지지 않았다' }
      - name: 사업부별 합성 보고자료 분석과 정답표 대조
        working-directory: ${{ env.PF_DIR }}
        env:
          PYTHONPATH: src
        run: |
          .venv\Scripts\python -m patent_marker.cli analyze --input tests\fixtures\divisions --output outputs\divisions-001
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python tools\check_expected.py --results outputs\divisions-001\results.jsonl
      - name: 시험용 패키지 설치 (인터넷 사용)
        working-directory: ${{ env.PF_DIR }}
        run: .venv\Scripts\python -m pip install --disable-pip-version-check --no-cache-dir -r requirements\dev.in
      - name: 묶음 안의 시험 전체 (실제 모델 포함)
        working-directory: ${{ env.PF_DIR }}
        run: .venv\Scripts\python -m pytest -ra
      - name: 코드만 바꾸기 (이전 묶음을 설치한 위에 새 code-only zip 덮어쓰기)
        if: inputs.base_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ inputs.base_tag }}
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'base'
          gh release download $env:BASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'patent_finder-*-windows-x64*.zip' --dir $base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = Join-Path $env:PF_ROOT 'code update'
          New-Item -ItemType Directory -Path $root | Out-Null
          $zip = Get-ChildItem (Join-Path $base '*.zip') | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $root
          $pf = Join-Path $root 'patent_finder'
          "이전 버전 설치: $pf ($($zip.Name))"
          Push-Location $pf
          cmd /c "setup.bat < nul"
          if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
          Pop-Location
          $code = Join-Path $env:RUNNER_TEMP 'code'
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'patent_finder-*-code-only.zip' --dir $code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $codezip = Get-ChildItem (Join-Path $code '*.zip') | Select-Object -First 1
          "새 코드 덮어쓰기: $($codezip.Name)"
          Expand-Archive -LiteralPath $codezip.FullName -DestinationPath $root -Force
          if (-not (Test-Path -LiteralPath (Join-Path $pf 'train.bat'))) { throw 'train.bat이 없다' }
          "PF_CODE_DIR=$pf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 코드만 바꾼 폴더에서 batch 파일 확인 (setup.bat 없이)
        if: inputs.base_tag != ''
        working-directory: ${{ env.PF_CODE_DIR }}
        run: python tests\windows_bundle_check.py --expect ${{ matrix.python-version }} --code-updated
